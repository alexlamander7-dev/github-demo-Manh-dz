<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thiết kế Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            border: 5px solid white;
            height: 100%;
        }
        header {
            display: flex;
            align-items: center;
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
        }

        header img {
            width: 60px;
            margin-right: 15px;
            border-radius: 50%;
        }
        nav {
            background-color: #2563eb;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            padding: 12px 20px;
            color: white;
            cursor: pointer;
        }

        nav ul li:hover {
            background-color: #1d4ed8;
        }
        .container {
            display: flex;
        }

        main {
            flex: 3;
            background-color: #e0f2fe;
            padding: 20px;
        }

        aside {
            flex: 1;
            background-color: #e5e7eb;
            padding: 20px;
        }
        .form-box {
            width: 60%;
            margin: auto;
            background-color: #3b82f6;
            padding: 20px;
            color: white;
            border-radius: 10px;
        }

        footer {
            background-color: #111827;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
